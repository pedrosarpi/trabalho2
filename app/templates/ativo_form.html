{% extends 'base.html' %}{% block content %}<a class="back" href="{{ url_for('ativos') }}">← Ativos</a><div class="page-head"><div><h1>{{ 'Editar ativo' if ativo else 'Cadastrar ativo' }}</h1><p>Identifique o ativo e defina quem é responsável por ele.</p></div></div><form method="post" class="card form-card">{{ campo_oculto(revisao) }}<div class="form-grid"><label>Identificador<input name="id_ativo" type="number" min="0" max="999999" required value="{{ ativo.id_ativo if ativo else '' }}" {% if ativo %}readonly{% endif %}><small>Inteiro único de 0 a 999999.</small></label><label>Nome ou hostname<input name="nome" required maxlength="120" value="{{ ativo.nome if ativo else '' }}"></label><label>Tipo{{ selecao('tipo', tipos, ativo.tipo if ativo else None) }}</label><label>Status{{ selecao('status', status_ativos, ativo.status if ativo else None) }}</label><label>Vincular responsável a uma conta<select name="responsavel_id" id="responsavel_id"><option value="">Informar pessoa ou equipe manualmente</option>{% for u in contas %}<option value="{{ u.id }}" {% if ativo and ativo.responsavel_id == u.id %}selected{% endif %}>{{ u.login }}</option>{% endfor %}</select><small>O vínculo acompanha mudanças do login.</small></label><label>Responsável manual<input name="responsavel" id="responsavel_manual" maxlength="120" value="{{ ativo.responsavel if ativo else '' }}"><small>Obrigatório quando nenhuma conta está vinculada.</small></label><label class="span2">Setor ou localização<input name="setor_localizacao" required maxlength="160" value="{{ ativo.setor_localizacao if ativo else '' }}"></label><label class="span2">Descrição<textarea name="descricao" rows="4" maxlength="5000">{{ ativo.descricao if ativo else '' }}</textarea></label></div><div class="form-actions"><a class="button" href="{{ url_for('ativos') }}">Cancelar</a><button class="button primary">Salvar ativo</button></div></form>{% endblock %}
