name: Python CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt
      - name: Verificar erros de código
        run: python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Testes
        run: python -m pytest -q
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar e construir
        run: |
          python3 scripts/configurar.py --projeto inventario-ci --porta 18080
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 180
      - name: Testar saúde, login, persistência e reinício
        run: |
          python3 scripts/smoke_http.py --url http://127.0.0.1:18080 --criar
          docker compose restart
          for tentativa in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/healthz; then break; fi
            sleep 2
          done
          python3 scripts/smoke_http.py --url http://127.0.0.1:18080 --verificar
      - name: Logs
        if: always()
        run: docker compose logs --no-color
      - name: Encerrar ambiente temporário do CI
        if: always()
        run: docker compose down -v
